# Builds festival-wifi for Windows x64, Linux x86_64 and FreeBSD 15.1 amd64 and stores them as a DRAFT release.
# The draft is created only from main or a v* tag; other refs just build. Publishing is manual, after minisign signing (guide chapter 5). No service data, keys or DB settings are used.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: festival-wifi-windows-x64.zip
          - os: ubuntu-24.04
            archive: festival-wifi-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (hash-locked on Windows)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m pip install --require-hashes --only-binary=:all: -r server/requirements.lock
          else
            python -m pip install -r server/requirements.txt
          fi
          python -m pip install pyinstaller==6.22.3
      - name: Build and self-check
        shell: bash
        run: python tools/build_binary.py --output "$RUNNER_TEMP/build"
      - name: Package
        shell: bash
        run: |
          cd "$RUNNER_TEMP/build/dist"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/${{ matrix.archive }}" festival-wifi
          else
            tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" festival-wifi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  build-freebsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-check in FreeBSD 15.1 (same steps as guide chapter 5)
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          usesh: true
          prepare: |
            pkg install -y python312 py312-cryptography
          run: |
            set -e
            freebsd-version
            pkg info py312-cryptography | head -1
            python3.12 -m venv --system-site-packages /tmp/build-venv
            /tmp/build-venv/bin/pip install Flask==3.1.3 Werkzeug==3.1.9 waitress==3.0.2 blinker==1.9.0 click==8.5.0 itsdangerous==2.2.0 Jinja2==3.1.6 MarkupSafe==3.0.4 mysql-connector-python==9.7.0 pyinstaller==6.22.3
            /tmp/build-venv/bin/python tools/build_binary.py --output /tmp/festival-build
            tar -czf festival-wifi-freebsd15-amd64.tar.gz -C /tmp/festival-build/dist festival-wifi
      - uses: actions/upload-artifact@v4
        with:
          name: festival-wifi-freebsd15-amd64.tar.gz
          path: festival-wifi-freebsd15-amd64.tar.gz

  draft-release:
    needs: [build, build-freebsd]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create draft release with SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          cd out
          sha256sum * > SHA256SUMS.txt
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "$TAG" --notes "Local-only build. Unsigned draft: sign SHA256SUMS.txt with minisign and upload SHA256SUMS.txt.minisig before publishing (guide chapter 5)."
