# Reference only. Do not include in the closed/503 preparation configuration.
# Application transport must explicitly use https_transport.enabled=true and intake=false.
# Listen/apply access controls on the reviewed management/public vhosts separately.
# The public vhost must block /admin, /v1/admin and /health paths (including slash variants).
# Set Host to the FIXED portal hostname in public locations, and FIXED admin hostname
# in management locations. Do not copy an arbitrary client Host header.
# These are replacement values, not appended chains. Exactly one proxy is supported.
# Replace the example host below with the matching, reviewed vhost hostname.
proxy_set_header Host wifi.example.org;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Forwarded-Server "";
# Do not configure a CDN or additional proxy in front of this single-proxy boundary.
# No proxy_pass is supplied here. Certificate, ACL, firewall and real TLS tests remain.
